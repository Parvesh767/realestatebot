spring.application.name=realestatebot


spring.thymeleaf.cache=false


# ======================================
# SERVER SETTINGS
# ======================================
server.port=8080

# ======================================
# POSTGRESQL SETTINGS
# ======================================
spring.datasource.url=jdbc:postgresql://localhost:5432/realbot
spring.datasource.username=realbot_user
spring.datasource.password=1998




# Hibernate auto create/update tables
spring.jpa.hibernate.ddl-auto=update

# Show SQL in logs (good for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ======================================
# LOGGING SETTINGS (simple + powerful)
# ======================================
# Root logging level (DEBUG gives detailed output)
logging.level.root=INFO

# Log SQL Queries
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Log incoming HTTP requests
logging.level.org.springframework.web=DEBUG

# Log your project packages
logging.level.com.risingbee.realestate.realstatebot=DEBUG

# Pretty JSON logs (optional)
# spring.jackson.serialization.indent_output=true

