<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Property Search — Find Your Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Main Navigation -->
  <header class="border-b border-slate-800 bg-slate-900/60 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-600/30">
          <i data-lucide="home" class="w-5 h-5"></i>
        </div>
        <span class="font-bold text-lg text-white tracking-tight">Property Hub</span>
      </div>

      <div class="flex items-center gap-3">
        <a href="/web/auth/login" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700/80 px-4 py-2 rounded-xl transition border border-slate-700/60">
          <i data-lucide="user" class="w-4 h-4 text-indigo-400"></i>
          Broker Portal
        </a>
      </div>
    </div>
  </header>

  <!-- Hero & Natural Search Input -->
  <main class="max-w-4xl mx-auto px-6 py-16 w-full my-auto text-center space-y-8">
    <div class="space-y-3">
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
        Natural Language Matching
      </span>
      <h1 class="text-4xl sm:text-5xl font-extrabold text-white tracking-tight leading-tight">
        Rentals in Simple Words.
      </h1>
      <p class="text-slate-400 text-sm sm:text-base max-w-lg mx-auto">
        State your requirements naturally or use our curated area prompts.
      </p>
    </div>

    <!-- Search Form -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-4 sm:p-5 shadow-2xl shadow-slate-950/80 space-y-4 backdrop-blur-sm">
      <form th:action="@{/search/results}" method="post" class="flex flex-col sm:flex-row items-center gap-3">
        <div class="relative w-full">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
            <i data-lucide="search" class="w-5 h-5 text-indigo-400"></i>
          </div>
          <input type="text"
                 id="searchInput"
                 name="query"
                 placeholder="e.g. 2BHK rent near Sohna Road in Gurgaon under 30k"
                 required
                 class="w-full pl-12 pr-4 py-4 rounded-2xl bg-slate-800/90 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm sm:text-base" />
        </div>

        <button type="submit" 
                class="w-full sm:w-auto px-8 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm rounded-2xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center shrink-0 gap-2">
          <i data-lucide="send" class="w-4 h-4"></i>
          <span>Search</span>
        </button>
      </form>

      <!-- Suggestion Chips -->
      <div class="flex flex-wrap items-center justify-center gap-2 pt-2 text-xs">
        <span class="text-slate-500 font-medium mr-1">Suggestions:</span>
        <button type="button" onclick="setSearchQuery('2BHK rent near Sohna Road under 30k')" class="px-3 py-1.5 rounded-lg bg-slate-800/60 hover:bg-indigo-600/20 hover:text-indigo-300 text-slate-400 border border-slate-700/60 transition">
          2BHK Sohna Road &lt; 30k
        </button>
        <button type="button" onclick="setSearchQuery('3BHK furnished in Sector 49 Gurgaon')" class="px-3 py-1.5 rounded-lg bg-slate-800/60 hover:bg-indigo-600/20 hover:text-indigo-300 text-slate-400 border border-slate-700/60 transition">
          3BHK in Sector 49
        </button>
        <button type="button" onclick="setSearchQuery('Studio apartment under 15k')" class="px-3 py-1.5 rounded-lg bg-slate-800/60 hover:bg-indigo-600/20 hover:text-indigo-300 text-slate-400 border border-slate-700/60 transition">
          Studio &lt; 15k
        </button>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
    <p>Smart Property Automation & Matching Engine</p>
  </footer>

  <script>
    function setSearchQuery(val) {
      const input = document.getElementById('searchInput');
      input.value = val;
      input.focus();
    }
    lucide.createIcons();
  </script>
</body>
</html>
