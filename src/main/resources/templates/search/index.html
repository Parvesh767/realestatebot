<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Property - Smart Rental Search</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Top Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-house-circle-check text-lg"></i>
                </div>
                <span class="font-bold text-xl text-slate-900 tracking-tight">Bee_Homes</span>
            </div>
            <a th:href="@{/web/auth/login}" class="text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl transition-all border border-slate-200 flex items-center">
                <i class="fa-solid fa-user-shield me-2 text-indigo-500"></i>Owner / Admin Portal
            </a>
        </div>
    </header>

    <!-- Main Content Hero Section -->
    <main class="max-w-4xl mx-auto px-6 py-12 my-auto w-full">
        <div class="text-center space-y-4 mb-8">
            <!-- Decorative Badge -->
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-600 border border-indigo-100">
                <i class="fa-solid fa-wand-magic-sparkles me-1.5 text-indigo-500"></i>AI-Powered Natural Search
            </span>

            <h1 class="text-4xl sm:text-5xl font-extrabold text-slate-900 tracking-tight">
                Find Your Perfect Rental
            </h1>

            <p class="text-slate-500 text-base sm:text-lg max-w-lg mx-auto">
                No complex filters required. Just describe what you want in simple words.
            </p>
        </div>

        <!-- Search Box Container -->
        <div class="bg-white p-4 sm:p-6 rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 space-y-4">
            <form th:action="@{/search/results}" method="post" class="relative flex flex-col sm:flex-row items-center gap-3">
                
                <div class="relative w-full">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-indigo-500">
                        <i class="fa-solid fa-magnifying-glass text-lg"></i>
                    </div>
                    <input type="text"
                           id="searchInput"
                           name="query"
                           placeholder="e.g. 2BHK rent in Gurgaon under 30k"
                           required
                           class="w-full pl-12 pr-4 py-4 rounded-2xl bg-slate-50 border border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-base" />
                </div>

                <button type="submit" 
                        class="w-full sm:w-auto px-8 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-2xl shadow-lg shadow-indigo-200 hover:shadow-indigo-300 transition-all flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-paper-plane me-2 text-sm"></i>Search
                </button>
            </form>

            <!-- Quick Suggestion Tags -->
            <div class="pt-2 flex flex-wrap items-center gap-2 text-xs">
                <span class="text-slate-400 font-medium me-1">Try searching:</span>
                
                <button type="button" 
                        onclick="setSearchQuery('2BHK furnished in Sector 49 under 25k')" 
                        class="px-3 py-1.5 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 rounded-lg transition-colors font-medium border border-slate-200/60">
                    2BHK in Sector 49 &lt; 25k
                </button>

                <button type="button" 
                        onclick="setSearchQuery('1BHK near Park Hospital Gurgaon')" 
                        class="px-3 py-1.5 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 rounded-lg transition-colors font-medium border border-slate-200/60">
                    1BHK near Park Hospital
                </button>

                <button type="button" 
                        onclick="setSearchQuery('Studio apartment under 15k')" 
                        class="px-3 py-1.5 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 rounded-lg transition-colors font-medium border border-slate-200/60">
                    Studio under 15k
                </button>
            </div>
        </div>

        <!-- Popular Locations Grid -->
        <div class="mt-12 space-y-4">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 text-center">Popular Search Hubs</h2>
            
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <button type="button" onclick="setSearchQuery('Rentals in Gurgaon')" class="p-3 bg-white hover:bg-indigo-50/50 rounded-xl border border-slate-100 text-slate-700 hover:border-indigo-200 transition-all text-center group">
                    <i class="fa-solid fa-city text-indigo-500 mb-1 group-hover:scale-110 transition-transform"></i>
                    <p class="text-xs font-semibold">Gurgaon</p>
                </button>

                <button type="button" onclick="setSearchQuery('Rentals in Sector 49')" class="p-3 bg-white hover:bg-indigo-50/50 rounded-xl border border-slate-100 text-slate-700 hover:border-indigo-200 transition-all text-center group">
                    <i class="fa-solid fa-location-dot text-indigo-500 mb-1 group-hover:scale-110 transition-transform"></i>
                    <p class="text-xs font-semibold">Sector 49</p>
                </button>

                <button type="button" onclick="setSearchQuery('Rentals in Golf Course Road')" class="p-3 bg-white hover:bg-indigo-50/50 rounded-xl border border-slate-100 text-slate-700 hover:border-indigo-200 transition-all text-center group">
                    <i class="fa-solid fa-road text-indigo-500 mb-1 group-hover:scale-110 transition-transform"></i>
                    <p class="text-xs font-semibold">Golf Course Rd</p>
                </button>

                <button type="button" onclick="setSearchQuery('Rentals in Sohna Road')" class="p-3 bg-white hover:bg-indigo-50/50 rounded-xl border border-slate-100 text-slate-700 hover:border-indigo-200 transition-all text-center group">
                    <i class="fa-solid fa-building text-indigo-500 mb-1 group-hover:scale-110 transition-transform"></i>
                    <p class="text-xs font-semibold">Sohna Road</p>
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-100 py-6 text-center text-xs text-slate-400 bg-white">
        <p>© 2026 RaisingBee. Smart Property Search Platform.</p>
    </footer>

    <!-- Interactive Helper Script -->
    <script>
        function setSearchQuery(text) {
            const input = document.getElementById('searchInput');
            input.value = text;
            input.focus();
        }
    </script>
</body>
</html>
