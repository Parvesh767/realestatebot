<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Unit Details — Broker Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen antialiased flex flex-col justify-between">

    <!-- Unified Sticky Navbar -->
    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="max-w-3xl mx-auto my-12 px-6 w-full">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">

            <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                <div>
                    <h1 class="text-xl font-bold text-white flex items-center gap-2">
                        <i data-lucide="settings-2" class="w-5 h-5 text-indigo-400"></i> 
                        <span th:text="${unit.unitName}">Unit Details</span>
                    </h1>
                    <p class="text-xs text-slate-400 mt-1">Override parent building details for this specific unit.</p>
                </div>
                <a th:href="@{/admin/properties}"
                    class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold border border-slate-700 transition">
                    ← Back to Inventory
                </a>
            </div>

            <form th:action="@{'/admin/properties/units/' + ${unit.id} + '/edit'}" method="POST" th:object="${unit}" class="space-y-6">

                <!-- Financials -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Monthly Rent (₹)</label>
                        <input type="number" th:field="*{rentInr}" required
                            class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white text-xs focus:ring-2 focus:ring-indigo-500" />
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Security Deposit (₹)</label>
                        <input type="number" th:field="*{securityDepositInr}" 
                            class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white text-xs focus:ring-2 focus:ring-indigo-500" />
                    </div>
                </div>

                <!-- Furnishing Dropdown (Triggers Auto-Select) -->
                <div class="space-y-1.5">
                    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Unit Furnishing State</label>
                    <select th:field="*{furnishing}" id="furnishingDropdown"
                        class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white text-xs cursor-pointer focus:ring-2 focus:ring-indigo-500">
                        <option value="FULLY_FURNISHED">Fully Furnished</option>
                        <option value="SEMI_FURNISHED">Semi-Furnished</option>
                        <option value="UNFURNISHED">Unfurnished</option>
                    </select>
                </div>

                <!-- Furnishing Assets (Auto-Managed but Manually Editable) -->
                <div class="space-y-2">
                    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">
                        Unit-Specific Furnishing Assets <span class="text-indigo-400 normal-case ml-1">(Auto-selects based on state)</span>
                    </label>
                    <div class="flex flex-wrap gap-2">
                        <label class="cursor-pointer">
                            <input type="checkbox" th:field="*{amenities}" value="AC" class="peer sr-only furnishing-asset" />
                            <div class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-500 transition flex items-center gap-1.5">❄️ AC</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" th:field="*{amenities}" value="BED" class="peer sr-only furnishing-asset" />
                            <div class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-500 transition flex items-center gap-1.5">🛏️ Bed & Mattress</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" th:field="*{amenities}" value="TV" class="peer sr-only furnishing-asset" />
                            <div class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-500 transition flex items-center gap-1.5">📺 Smart TV</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" th:field="*{amenities}" value="FRIDGE" class="peer sr-only furnishing-asset" />
                            <div class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-500 transition flex items-center gap-1.5">🧊 Refrigerator</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" th:field="*{amenities}" value="WARDROBE" class="peer sr-only furnishing-asset" />
                            <div class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-500 transition flex items-center gap-1.5">🚪 Wardrobes</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" th:field="*{amenities}" value="GEYSER" class="peer sr-only furnishing-asset" />
                            <div class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-500 transition flex items-center gap-1.5">🚿 Geyser</div>
                        </label>
                    </div>
                </div>

                <!-- Unit-Specific Description -->
                <div class="space-y-1.5">
                    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Special Notes / Description</label>
                    <textarea th:field="*{description}" rows="4" placeholder="Mention any extra upgrades or specific unit details (e.g. Corner flat, extra balcony, freshly painted)..."
                        class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white text-xs focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <button type="submit"
                    class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                    <i data-lucide="check" class="w-4 h-4"></i>
                    Save Custom Unit Details
                </button>
            </form>
        </div>
    </main>

    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>Smart Property Automation & Broker Portal</p>
    </footer>

    <div th:replace="~{fragments/header :: navScripts}"></div>
    
    <!-- Smart Engine Logic for Auto-Selection -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // Smart Furnishing Auto-Selector
            const furnishingSelect = document.getElementById('furnishingDropdown');
            const assetCheckboxes = document.querySelectorAll('.furnishing-asset');

            const autoSelectRules = {
                'FULLY_FURNISHED': ['AC', 'BED', 'TV', 'FRIDGE', 'WARDROBE', 'GEYSER'],
                'SEMI_FURNISHED': ['WARDROBE', 'GEYSER'],
                'UNFURNISHED': []
            };

            if (furnishingSelect) {
                furnishingSelect.addEventListener('change', (e) => {
                    const selectedState = e.target.value;
                    const itemsToCheck = autoSelectRules[selectedState] || [];
                    
                    assetCheckboxes.forEach(cb => {
                        cb.checked = itemsToCheck.includes(cb.value);
                    });
                });
            }
        });
    </script>
</body>

</html>
