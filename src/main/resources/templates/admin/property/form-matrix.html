<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${propertyId != null ? 'Edit Property — Broker Console' : 'Add Property — Fast Publish'}">Property
		Form</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen antialiased flex flex-col justify-between">

	<!-- Unified Sticky Navbar -->
	<div th:replace="~{fragments/header :: navbar}"></div>

	<main class="max-w-4xl mx-auto my-8 px-6 w-full">
		<div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">

			<div class="flex items-center justify-between pb-4 border-b border-slate-800">
				<div>
					<h1 class="text-xl font-bold text-white"
						th:text="${propertyId != null ? 'Edit Property Details' : 'Publish New Rental Listing'}">Publish
						Listing</h1>
					<p class="text-xs text-slate-400 mt-1">Quick form with floor specifications, smart amenities, and
						instant preview.</p>
				</div>
				<a th:href="@{/admin/properties}"
					class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold border border-slate-700 transition">
					← Back to Inventory
				</a>
			</div>

			<form th:action="${propertyId != null ? '/admin/properties/' + propertyId : '/admin/properties/new'}"
				method="POST" enctype="multipart/form-data" th:object="${property}" class="space-y-6">
				
				<input type="hidden" name="listingMode" value="MATRIX" />

				<!-- 1. Core Specs -->
				<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
					<div class="sm:col-span-2 space-y-1.5">
						<label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Listing Title
							*</label>
						<input type="text" th:field="*{title}" placeholder="e.g. Luxury 2BHK with Balcony" required
							class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white text-xs focus:ring-2 focus:ring-indigo-500" />
					</div>

					<div class="space-y-1.5">
						<label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Floor / Level
							*</label>
						<input type="text" th:field="*{floorNumber}" placeholder="e.g. 2nd Floor / Unit 202" required
							class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white text-xs focus:ring-2 focus:ring-indigo-500" />
					</div>

					<div class="space-y-1.5">
						<label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">BHK / Type
							*</label>
						<select th:field="*{bhk}" required
							class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white text-xs">
							<option value="1RK">1 RK / Studio</option>
							<option value="1BHK">1 BHK</option>
							<option value="2BHK">2 BHK</option>
							<option value="3BHK">3 BHK</option>
							<option value="4+BHK">4+ BHK / Villa</option>
						</select>
					</div>

					<div class="space-y-1.5">
						<label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Monthly Rent (₹)
							*</label>
						<input type="number" th:field="*{price}" placeholder="28000" required
							class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white text-xs focus:ring-2 focus:ring-indigo-500" />
					</div>

					<div class="space-y-1.5">
						<label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Security Deposit
							(₹)</label>
						<input type="number" th:field="*{securityDeposit}" placeholder="50000"
							class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white text-xs" />
					</div>

					<div class="space-y-1.5 sm:col-span-3">
						<label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Furnishing
							State</label>
					<select th:field="*{furnishing}" id="furnishingDropdown" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white text-xs cursor-pointer">
							class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white text-xs">
							<option value="FULLY_FURNISHED">Fully Furnished</option>
							<option value="SEMI_FURNISHED">Semi-Furnished</option>
							<option value="UNFURNISHED">Unfurnished</option>
						</select>
					</div>
				</div>

				<!-- 2. Location Text Resolution -->
				<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
					<div class="space-y-1.5">
						<label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Locality / Landmark
							*</label>
						<input type="text" th:field="*{area}" placeholder="e.g. Sector 49, Sohna Road" required
							class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white text-xs" />
					</div>
					<div class="space-y-1.5">
						<label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Google Maps /
							Location Link</label>
						<input type="url" th:field="*{mapLink}" placeholder="https://maps.app.goo.gl/..."
							class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white text-xs" />
					</div>
					
					<div class="space-y-1.5">
					  <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">City Code *</label>
					  <input type="text" th:field="*{cityCode}" placeholder="e.g. DEL, GUR, BLR" required
					         class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white text-xs" />
					</div>
					
				</div>

				<!-- 3. Amenities Selector -->
				<!-- 3A. Building / Structural Amenities -->
				<div class="space-y-2">
				    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Building Amenities</label>
				    <div class="flex flex-wrap gap-2">
				        <label class="cursor-pointer">
				            <input type="checkbox" name="amenities" value="POWER_BACKUP" class="peer sr-only" />
				            <div class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-500 transition flex items-center gap-1.5">⚡ Power Backup</div>
				        </label>
				        <label class="cursor-pointer">
				            <input type="checkbox" name="amenities" value="PARKING" class="peer sr-only" />
				            <div class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-500 transition flex items-center gap-1.5">🚗 Reserved Parking</div>
				        </label>
				        <label class="cursor-pointer">
				            <input type="checkbox" name="amenities" value="GYM" class="peer sr-only" />
				            <div class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-500 transition flex items-center gap-1.5">🏋️ Fitness Gym</div>
				        </label>
				        <label class="cursor-pointer">
				            <input type="checkbox" name="amenities" value="GATED_SOCIETY" class="peer sr-only" />
				            <div class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium peer-checked:bg-indigo-600 peer-checked:border-indigo-500 transition flex items-center gap-1.5">🛡️ 24/7 Security</div>
				        </label>
				        <label class="cursor-pointer">
				            <input type="checkbox" name="amenities" value="LIFT" class="peer sr-only" />
				            <div class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-500 transition flex items-center gap-1.5">🛗 Lift</div>
				        </label>
				    </div>
				</div>

				<!-- 3B. Furnishing Assets (Auto-Managed) -->
				<div class="space-y-2 mt-4">
				    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Furnishing Assets <span class="text-indigo-400 normal-case ml-1">(Auto-selects based on state)</span></label>
				    <div class="flex flex-wrap gap-2">
				        <label class="cursor-pointer">
				            <input type="checkbox" name="amenities" value="AC" class="peer sr-only furnishing-asset" />
				            <div class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-500 transition flex items-center gap-1.5">❄️ AC</div>
				        </label>
				        <label class="cursor-pointer">
				            <input type="checkbox" name="amenities" value="BED" class="peer sr-only furnishing-asset" />
				            <div class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-500 transition flex items-center gap-1.5">🛏️ Bed & Mattress</div>
				        </label>
				        <label class="cursor-pointer">
				            <input type="checkbox" name="amenities" value="TV" class="peer sr-only furnishing-asset" />
				            <div class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-500 transition flex items-center gap-1.5">📺 Smart TV</div>
				        </label>
				        <label class="cursor-pointer">
				            <input type="checkbox" name="amenities" value="FRIDGE" class="peer sr-only furnishing-asset" />
				            <div class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-500 transition flex items-center gap-1.5">🧊 Refrigerator</div>
				        </label>
				        <label class="cursor-pointer">
				            <input type="checkbox" name="amenities" value="WARDROBE" class="peer sr-only furnishing-asset" />
				            <div class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-500 transition flex items-center gap-1.5">🚪 Wardrobes</div>
				        </label>
				        <label class="cursor-pointer">
				            <input type="checkbox" name="amenities" value="GEYSER" class="peer sr-only furnishing-asset" />
				            <div class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-500 transition flex items-center gap-1.5">🚿 Geyser</div>
				        </label>
				    </div>
				</div>



				<!-- Multi-Floor Matrix Generator Card -->
				<div class="bg-slate-800/40 border border-slate-700/80 rounded-2xl p-6 space-y-4">
				    <div>
				        <h3 class="text-sm font-bold text-white flex items-center gap-2">
				            <i data-lucide="layers" class="w-4 h-4 text-emerald-400"></i> Auto-Generate Units
				        </h3>
				        <p class="text-xs text-slate-400 mt-0.5">Define floor capacities. The system will generate units like 101, 102, 201 automatically.</p>
				    </div>
				    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pt-2">
				        <div>
				            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Total Floors</label>
				            <input type="number" name="totalFloors" min="1" max="50" value="1" class="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:ring-2 focus:ring-emerald-500" />
				        </div>
				        <div>
				            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Units Per Floor (Comma Separated)</label>
				            <input type="text" name="unitsDistribution" placeholder="e.g. 4, 4, 2" class="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:ring-2 focus:ring-emerald-500" />
				        </div>
				        <div>
				            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Base Rent Per Unit (₹)</label>
				            <input type="number" name="floorRent" placeholder="Leave blank to use base" class="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:ring-2 focus:ring-emerald-500" />
				        </div>
				    </div>
				</div>


				<!-- 4. Video Tour Link -->
				<div class="space-y-1.5">
					<label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Virtual Video
						Walkthrough / Reel Link</label>
					<input type="url" th:field="*{videoTourUrl}" placeholder="e.g. YouTube Video, Instagram Reel"
						class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white text-xs" />
				</div>




				<button type="submit"
					class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-xl shadow-lg transition flex items-center justify-center gap-2">
					<i data-lucide="check" class="w-4 h-4"></i>
					<span th:text="${propertyId != null ? 'Save Changes' : 'Publish Listing Now'}">Publish
						Listing</span>
				</button>
			</form>
		</div>
	</main>

	<footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
		<p>Smart Property Automation & Matching Engine</p>
	</footer>

	<div th:replace="~{fragments/header :: navScripts}"></div>
	<script>
	
		document.addEventListener('DOMContentLoaded', () => {
		    lucide.createIcons();

		    // Smart Furnishing Auto-Selector
		    const furnishingSelect = document.getElementById('furnishingDropdown');
		    const assetCheckboxes = document.querySelectorAll('.furnishing-asset');

		    const autoSelectRules = {
		        'FULLY_FURNISHED': ['AC', 'BED', 'TV', 'FRIDGE', 'WARDROBE', 'GEYSER'],
		        'SEMI_FURNISHED': ['WARDROBE', 'GEYSER'],
		        'UNFURNISHED': []
		    };

		    if (furnishingSelect) {
		        furnishingSelect.addEventListener('change', (e) => {
		            const selectedState = e.target.value;
		            const itemsToCheck = autoSelectRules[selectedState] || [];
		            
		            assetCheckboxes.forEach(cb => {
		                // Check the box if its value is in the rules array
		                cb.checked = itemsToCheck.includes(cb.value);
		            });
		        });
		    }
		});	
	
	
		document.addEventListener('DOMContentLoaded', () => {
			syncNavState();
			lucide.createIcons();
		});
	</script>
</body>

</html>
