<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Move-In / Move-Out Inspection — Property Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <div th:replace="~{fragments/header :: navbar}"></div>

  <main class="max-w-3xl mx-auto my-8 px-6 w-full space-y-6">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
      
      <div class="flex items-center justify-between pb-4 border-b border-slate-800">
        <div>
          <h1 class="text-xl font-bold text-white">Record Inspection Audit</h1>
          <p class="text-xs text-slate-400 mt-1" 
             th:text="'Contract #' + ${contract.id} + ' — ' + (${property != null} ? ${property.title} : 'Property #' + ${contract.propertyId})">
            Inspection details
          </p>
        </div>
        <a th:href="@{'/tenancy/' + ${contract.id} + '/settlement'}" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold border border-slate-700 transition">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Settlement
        </a>
      </div>

      <form th:action="@{'/tenancy/' + ${contract.id} + '/inspections'}" method="POST" enctype="multipart/form-data" class="space-y-4">
        
        <!-- Inspection Type -->
        <div class="space-y-1.5">
          <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Inspection Type *</label>
          <select name="type" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="MOVE_IN">Move-In Handover Baseline</option>
            <option value="MOVE_OUT">Move-Out Exit Inspection</option>
            <option value="ROUTINE">Routine Maintenance Audit</option>
          </select>
        </div>

        <!-- Meter Reading Section -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Electricity Meter Reading (Units)</label>
            <input type="number" step="0.1" name="meterReading" placeholder="e.g. 1420.5"
                   class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white text-xs font-mono focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
          </div>

          <div class="space-y-1.5">
            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Meter Photo Proof</label>
            <label class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-xs text-slate-400 cursor-pointer hover:border-slate-600 transition truncate">
              <i data-lucide="camera" class="w-4 h-4 text-indigo-400 shrink-0"></i>
              <span id="meter-photo-label" class="truncate">Upload Meter Photo</span>
              <input type="file" name="meterPhoto" accept="image/*" class="sr-only" 
                     onchange="document.getElementById('meter-photo-label').innerText = this.files[0] ? this.files[0].name : 'Upload Meter Photo'" />
            </label>
          </div>
        </div>

        <!-- Room Condition Evidence -->
        <div class="space-y-1.5 pt-2">
          <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Room Condition Photos (Multiple)</label>
          <label class="flex items-center justify-center gap-2 p-6 rounded-2xl bg-slate-800/60 border-2 border-dashed border-slate-700 text-xs text-slate-400 cursor-pointer hover:border-indigo-500 transition">
            <i data-lucide="images" class="w-5 h-5 text-indigo-400"></i>
            <span id="rooms-photo-label">Select multiple photos of walls, fixtures, and appliances</span>
            <input type="file" name="roomPhotos" accept="image/*" multiple class="sr-only" 
                   onchange="document.getElementById('rooms-photo-label').innerText = this.files.length + ' photos selected'" />
          </label>
        </div>

        <!-- Notes -->
        <div class="space-y-1.5 pt-2">
          <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Inspection Remarks & Pre-existing Defects</label>
          <textarea name="notes" rows="3" placeholder="Document any existing scratches, water seepage, or included appliance serial numbers..."
                    class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white text-xs placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
        </div>

        <div class="pt-4 border-t border-slate-800 flex items-center justify-end gap-3">
          <a th:href="@{'/tenancy/' + ${contract.id} + '/settlement'}" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold border border-slate-700 transition">
            Cancel
          </a>
          <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-600/20 transition flex items-center gap-2">
            <i data-lucide="save" class="w-4 h-4"></i> Save Inspection Record
          </button>
        </div>
      </form>
    </div>
  </main>

  <footer class="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
    <p>Property Hub — Digital Move-In & Condition Auditing</p>
  </footer>

  <div th:replace="~{fragments/header :: navScripts}"></div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      syncNavState();
      lucide.createIcons();
    });
  </script>
</body>
</html>
